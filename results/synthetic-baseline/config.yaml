model_version: 0.2.0-synthetic
scenario_name: baseline
description: Five-band synthetic startup outcomes with one shared macro state per
  portfolio; architecture testing only.
assumption_status: SYNTHETIC_SCENARIO
initial_principal:
  value: 1000000
  units: GBP
  status: SCENARIO
  source: Synthetic S2a baseline
  notes: Reporting notional; all per-unit claim metrics are invariant to this scale.
horizon_years: 10
number_of_simulations: 5000
random_seed: 42
portfolio:

extends: base.yaml
scenario_name: "optimistic"
description: "Synthetic upside case with lower failures, stronger survivors and a fatter winner branch; not an empirical forecast."
random_seed: 20260814
macro:
  initial_state_probabilities:
    normal:
      value: 0.80
    weak:
      value: 0.17
    crisis:
      value: 0.03
  regimes:
    normal:
      outcome_bands:
        total_failure: {probability: {value: 0.45}}
        partial_recovery: {probability: {value: 0.16}}
        modest_success: {probability: {value: 0.28}}
        large_success: {probability: {value: 0.09}}
        extreme_winner: {probability: {value: 0.02}}
    weak:
      outcome_bands:
        total_failure: {probability: {value: 0.60}}
        partial_recovery: {probability: {value: 0.18}}
        modest_success: {probability: {value: 0.16}}
        large_success: {probability: {value: 0.05}}
        extreme_winner: {probability: {value: 0.01}}
    crisis:
      outcome_bands:
        total_failure: {probability: {value: 0.75}}
        partial_recovery: {probability: {value: 0.14}}
        modest_success: {probability: {value: 0.09}}
        large_success: {probability: {value: 0.018}}
        extreme_winner: {probability: {value: 0.002}}

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-markets"
version = "0.2.0"
description = "Auditable quantitative prototypes for principal-protected venture portfolios"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.3.2",
    "scipy==1.16.1",
    "pandas==2.3.1",
    "PyYAML==6.0.2",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
invariant = "invariant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

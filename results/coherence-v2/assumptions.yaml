baseline_marginal:
  body_model: log_uniform
  survival_tail_exponent_beta: 1.4306765580733931
  tail_mode: capped_pareto
  tail_cap: 1000.0
  interpretation: Frozen S2b-a V1; financing/deal-level gross marginal proxy, not
    unique-company calibration.
coherence_proxy_scenarios:
  portfolio_size_for_median_proxy: 100
  pooled_quantile_points: 200000
  portfolio_paths: 5000
  bodies:
  - log_uniform
  - truncated_lognormal
  tail_exponents:
  - 1.1
  - 1.3
  - 1.4306765580733931
  - 1.6
  tail_caps:
  - null
  - 100.0
  - 250.0
  - 500.0
  - 1000.0
  weighting_scenarios:
  - name: financing_round_reported
    winner_mass_scale: 1.0
    provenance: OBSERVED_AGGREGATE_INTERPRETATION
  - name: unique_company_reweighting_proxy
    winner_mass_scale: 0.75
    provenance: MODEL_RISK_PROXY_NOT_ESTIMATED
  - name: winner_duplication_stress
    winner_mass_scale: 0.5
    provenance: MODEL_RISK_PROXY_NOT_ESTIMATED
  below_1x_interpretations:
  - name: reported_strict_below_1x
    probability: 0.65
    provenance: OBSERVED_AGGREGATE
  - name: rounded_endpoint_low
    probability: 0.62
    provenance: MODEL_RISK_PROXY
  - name: realised_decomposition_39_plus_29
    probability: 0.68
    provenance: PROXY_FROM_NON_RECONCILING_AGGREGATE
  benchmark_tolerances:
    compatible_mean_absolute: 0.1
    compatible_median_absolute: 0.1
    weak_mean_absolute: 0.25
    weak_median_absolute: 0.35
dependence_scenarios:
  frontier:
    model: gaussian_factor
    rho_start: 0.0
    rho_stop: 0.4
    rho_step: 0.01
    portfolio_sizes:
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 2000
    protection_fractions:
    - 0.5
    - 0.75
    - 0.8
    - 0.9
    - 1.0
    screening_paths: 5000
    final_paths: 100000
    final_portfolio_sizes:
    - 100
    note: N=100 is refined across the full rho grid; larger-N frontier rows are explicitly
      screening estimates.
  winner_deletion:
    rho_values:
    - 0.1
    - 0.2
    - 0.3
    portfolio_sizes:
    - 100
    - 500
    - 1000
    protection_fractions:
    - 0.75
    - 0.9
    - 1.0
    paths: 100000
    deletion_rules:
    - normal
    - remove_top1
    - remove_top3
    - remove_top5
    - remove_all_ge_50x
    - remove_all_ge_10x
  model_comparison:
    rho: 0.2
    portfolio_sizes:
    - 100
    - 500
    - 1000
    protection_fractions:
    - 0.75
    - 0.9
    - 1.0
    paths: 25000
    models:
    - name: gaussian_one_factor
      family: gaussian_factor
      provenance: MODEL_RISK_SCENARIO
    - name: student_t_df4
      family: student_t_factor
      degrees_of_freedom: 4
      provenance: MODEL_RISK_SCENARIO
    - name: macro_state_mixture
      family: macro_state_mixture
      stress_probability: 0.2
      provenance: MODEL_RISK_SCENARIO_NOT_FITTED
    - name: sector_factor_toy
      family: sector_factor
      sector_rho: 0.15
      sectors: 10
      provenance: MODEL_RISK_SCENARIO_NOT_FITTED
provenance_limits:
  central_model_decision: NO_NEW_CENTRAL_MARGINAL_MODEL
  reason: Public aggregates do not identify unique-company weights, repeated rounds,
    censoring, cash-flow timing, fees, carry, or valuation treatment.
  prohibited_claims:
  - No selection or AI-underwriting alpha.
  - No product viability conclusion.
  - No empirical fit of dependence families.
  - No use of founder warrants as reliable protection.
